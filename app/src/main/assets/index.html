<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 16:9 屏幕适配 -->
    <meta name="screen-ratio" content="16:9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>"哒哒"宝贝 - 幼儿互动乐园</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/question.png">
    <meta name="apple-mobile-web-app-title" content="哒哒宝贝">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "方正少儿简体", "汉仪圆叠", "Comic Sans MS", "Microsoft YaHei", sans-serif;
        }

        /* 16:9 屏幕适配 - 根容器 */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        body {
            background-color: #FFFAFC;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 16:9 适配容器 */
        #app-container {
            width: 100%;
            height: 100%;
            max-width: 177.78vh; /* 16:9 比例 */
            max-height: 56.25vw; /* 9/16 */
            position: relative;
            overflow: hidden;
            background-color: #FFFAFC;
        }
        
        /* 竖屏设备适配 */
        @media (orientation: portrait) {
            #app-container {
                max-width: 100%;
                max-height: 177.78vw; /* 16:9 竖屏 */
            }
        }
        
        /* 横屏设备适配 */
        @media (orientation: landscape) {
            #app-container {
                max-width: 177.78vh;
                max-height: 100%;
            }
        }
        
        /* 页面内容区域 */
        .page {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 确保按钮可点击 */
        .module {
            cursor: pointer !important;
            -webkit-tap-highlight-color: rgba(255,136,187,0.3) !important;
        }

        /* 模块切换控制：默认显示主页面，隐藏其他页面 */
        .page {
            display: none;
            min-height: 100vh;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }

        /* ---------------- 主页面样式 ---------------- */
        .main-page {
            align-items: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        /* 主页面标题 */
        .main-title::before {
            content: "";
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-120px);
            width: 30px;
            height: 30px;
            background-color: #FFEE99;
            border-radius: 50%;
            opacity: 0.8;
            z-index: -1;
        }
        .main-title {
            font-size: 48px;
            font-weight: 700;
            color: #FF88BB;
            text-shadow: 1px 1px 3px rgba(255, 136, 187, 0.3);
            margin-bottom: 80px;
            letter-spacing: 8px;
            position: relative;
            animation: bounce 2.5s infinite ease-in-out;
            -webkit-font-smoothing: antialiased;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 主页面功能模块容器 */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 60px 40px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            padding: 0 10px;
        }

        /* 功能模块样式 */
        .module {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            background: none;
            border: none;
            padding: 0;
            width: 100%;
        }
        .module:focus {
            outline: 3px solid #FF88BB;
            outline-offset: 4px;
            border-radius: 20px;
        }
        .module:hover {
            transform: scale(1.08);
        }
        .module:active {
            transform: scale(1.05);
        }
        .module-icon {
            width: 160px;
            height: 160px;
            border-radius: 24px;
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(255, 136, 187, 0.15);
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid #FFE6F2;
            user-select: none;
        }
        .module-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            backface-visibility: hidden;
        }
        .module-label {
            font-size: 32px;
            color: #FF6699;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(255, 102, 153, 0.2);
            letter-spacing: 2px;
            user-select: none;
        }

        /* 模块位置 */
        .question-module {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }
        .view-module {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }
        .draw-module {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            position: relative;
        }
        .draw-module::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 10px;
            width: 25px;
            height: 25px;
            background-color: #99EEFF;
            border-radius: 50%;
            opacity: 0.7;
            z-index: -1;
        }
        .photo-module {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }

        /* ---------------- 聊天页面样式 ---------------- */
        .chat-page {
            flex-direction: column;
        }

        /* 聊天页面顶部导航 */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(90deg, #FF88BB, #FFB3D1);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(255, 136, 187, 0.2);
        }
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            cursor: pointer;
            border: none;
            font-size: 20px;
            color: #FF88BB;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-title {
            font-size: 32px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .mute-btn {
            position: absolute;
            right: 60px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
        }
        .new-chat-btn {
            position: absolute;
            right: 20px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
        }

        /* 聊天内容区域 */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 100%;
        }
        .welcome-msg {
            align-self: center;
            background-color: #FFE6F2;
            color: #FF6699;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(255, 102, 153, 0.1);
        }
        .msg {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 20px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .user-msg {
            align-self: flex-end;
            background-color: #FF88BB;
            color: white;
            border-bottom-right-radius: 5px;
            border-bottom-left-radius: 20px;
        }
        .dada-msg {
            align-self: flex-start;
            background-color: white;
            color: #333;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 20px;
            border: 2px solid #FFE6F2;
        }
        
        /* 聊天消息样式 - 用户在右，机器人在左 */
        .chat-message {
            max-width: 70%;
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 20px;
            font-size: 20px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #FF88BB, #FF6AA0);
            color: white;
            border-bottom-right-radius: 5px;
            border-bottom-left-radius: 20px;
            box-shadow: 0 2px 10px rgba(255, 136, 187, 0.3);
        }
        .bot-message {
            align-self: flex-start;
            background-color: white;
            color: #333;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 20px;
            border: 2px solid #FFE6F2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 图片回答区域 */
        .answer-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
        }
        .answer-img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #FFE6F2;
        }

        /* 聊天页面底部输入区 */
        .input-area {
            padding: 20px;
            background-color: white;
            border-top: 2px solid #FFE6F2;
            display: flex;
            align-items: center;
            gap: 15px;
            position: sticky;
            bottom: 0;
        }
        .voice-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF88BB, #FF6699);
            color: white;
            border: none;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 136, 187, 0.3);
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }
        .voice-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 136, 187, 0.3);
        }
        .voice-btn.recording {
            background: linear-gradient(135deg, #FF4488, #FF2266);
            animation: pulse 1s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .status-text {
            font-size: 18px;
            color: #FF88BB;
            flex: 1;
            text-align: center;
        }

        /* 大语音输入区域（贯通整个底部） */
        .big-voice-input-area {
            padding: 30px 20px;
            background: linear-gradient(135deg, #66CCFF, #44AAFF);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            min-height: 140px;
            position: sticky;
            bottom: 0;
        }
        .big-voice-input-area:active {
            background: linear-gradient(135deg, #44AAFF, #2288DD);
            transform: scale(0.98);
        }
        .big-voice-input-area.listening {
            background: linear-gradient(135deg, #FF88BB, #FF6699);
            animation: bigPulse 1s infinite ease-in-out;
        }
        .big-voice-icon {
            font-size: 55px;
            filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.2));
        }
        .big-voice-text {
            color: white;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* 大按钮脉冲动画 */
        @keyframes bigPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* ---------------- 看一看页面样式 ---------------- */
        .view-page {
            flex-direction: column;
        }

        /* 看一看子模块导航 */
        .view-subnav {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background-color: white;
            border-bottom: 2px solid #FFE6F2;
            position: sticky;
            top: 0;
            z-index: 90;
        }
        .subnav-item {
            padding: 10px 20px;
            font-size: 24px;
            color: #FF88BB;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: none;
            border: none;
        }
        .subnav-item:focus {
            outline: 3px solid #FF88BB;
            outline-offset: 2px;
        }
        .subnav-item.active {
            background-color: #FFE6F2;
            color: #FF6699;
        }

        /* 图片展示区域 */
        .view-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .photo-item {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(255, 136, 187, 0.15);
            aspect-ratio: 1/1;
            background-color: #FFE6F2;
            position: relative;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 上传按钮样式 */
        .upload-btn-container {
            padding: 20px;
            text-align: center;
        }
        .upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #99EEFF, #66CCFF);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(153, 238, 255, 0.3);
            transition: all 0.2s ease;
        }
        .upload-btn:active {
            transform: scale(0.95);
        }
        #fileInput {
            display: none;
        }

        /* 图片预览弹窗 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .preview-img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 15px;
            border: 5px solid white;
        }
        .close-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #FF88BB;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .delete-image-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            border-radius: 25px;
            background: linear-gradient(135deg, #FF6B6B, #EE5A5A);
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .delete-image-btn:hover {
            background: linear-gradient(135deg, #FF5252, #E04848);
        }

        /* ---------------- 画一画页面样式 ---------------- */
        .draw-page {
            flex-direction: column;
            background-color: #fff;
        }

        /* 画板顶部工具栏 */
        .draw-toolbar {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(90deg, #99EEFF, #66CCFF);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(153, 238, 255, 0.2);
        }

        /* 画板功能按钮区域 */
        .draw-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 15px;
            background-color: #f8f9ff;
            border-bottom: 2px solid #E6F7FF;
            gap: 10px;
        }

        /* 颜色选择器 */
        .color-picker {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.active {
            box-shadow: 0 0 0 3px #FF88BB;
        }

        /* 画笔粗细调节 */
        .brush-size {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 15px;
        }
        .size-label {
            font-size: 20px;
            color: #66CCFF;
            font-weight: 700;
        }
        .size-slider {
            width: 150px;
            accent-color: #FF88BB;
        }

        /* 功能按钮 */
        .draw-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FF88BB, #FF6699);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(255, 136, 187, 0.2);
            transition: all 0.2s ease;
            margin: 0 5px;
        }
        .draw-btn:active {
            transform: scale(0.95);
        }

        /* 画板容器 */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #drawCanvas {
            width: 100%;
            height: 100%;
            touch-action: none; /* 禁用默认触摸行为 */
        }

        /* ---------------- 拍一拍页面样式 ---------------- */
        .photo-page {
            flex-direction: column;
            padding-bottom: 20px;
        }

        /* 上传图片区域 */
        .photo-upload-section {
            padding: 30px 20px;
            background-color: white;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(255, 136, 187, 0.1);
            text-align: center;
        }
        .upload-title {
            font-size: 28px;
            color: #FF88BB;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .upload-area {
            border: 3px dashed #FFE6F2;
            border-radius: 15px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #FF88BB;
            background-color: #FFF8FA;
        }
        .upload-icon {
            font-size: 60px;
            color: #99EEFF;
            margin-bottom: 15px;
        }
        .upload-text {
            font-size: 20px;
            color: #FF88BB;
            margin-bottom: 10px;
        }
        .upload-hint {
            font-size: 16px;
            color: #999;
        }
        .preview-image-container {
            margin: 20px 0 0 0;
            display: none;
            text-align: center;
        }
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid #FFE6F2;
            object-fit: contain;
        }

        /* 语音输入区域 */
        .voice-input-section {
            padding: 30px 20px;
            background-color: white;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(255, 136, 187, 0.1);
            text-align: center;
        }
        .voice-title {
            font-size: 28px;
            color: #FF88BB;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .voice-input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .voice-record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF88BB, #FF6699);
            color: white;
            border: none;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 136, 187, 0.3);
            transition: all 0.2s ease;
        }
        .voice-record-btn.recording {
            background: linear-gradient(135deg, #FF4488, #FF2266);
            animation: pulse 1s infinite ease-in-out;
        }
        .voice-text {
            font-size: 20px;
            color: #666;
            padding: 15px 20px;
            border: 2px solid #FFE6F2;
            border-radius: 15px;
            width: 100%;
            min-height: 80px;
            resize: none;
            font-family: inherit;
        }
        .voice-text:focus {
            outline: none;
            border-color: #FF88BB;
        }

        /* 语音完成按钮 */
        .voice-complete-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF88BB, #FF6699);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 136, 187, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .voice-complete-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #FF6699, #FF4488);
            box-shadow: 0 8px 20px rgba(255, 136, 187, 0.4);
        }
        .voice-complete-btn:active {
            transform: scale(0.95);
        }
        .voice-complete-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 动画生成区域 */
        .animation-section {
            padding: 30px 20px;
            background-color: white;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(255, 136, 187, 0.1);
            text-align: center;
        }
        .animation-title {
            font-size: 28px;
            color: #FF88BB;

readAsDataURL(file); }; window.startPhotoVoiceRecognition = function() { if (!photoRecognition) { initPhotoVoiceRecognition(); } if (photoRecognition) { if (isPhotoRecording) { photoRecognition.stop(); isPhotoRecording = false; document.getElementById('photoVoiceBtn').classList.remove('recording'); } else { photoRecognition.start(); } } };</script>

        // 根据关键词获取随机图片（通用函数）
        function getRandomImagesByKeyword(keyword, count = 1) {
            const lowerKeyword = keyword.toLowerCase();
            // 查找所有匹配项
            const matches = [];
            for (const item of LOCAL_IMAGE_DB) {
                let matchScore = 0;
                // 名称完全匹配
                if (item.name === lowerKeyword) matchScore += 50;
                // 名称包含关键词
                else if (item.name.includes(lowerKeyword)) matchScore += 30;
                // 关键词包含名称
                else if (lowerKeyword.includes(item.name)) matchScore += 20;
                // 关键词匹配
                for (const kw of item.keywords) {
                    if (kw === lowerKeyword) matchScore += 40;
                    else if (lowerKeyword.includes(kw)) matchScore += 10;
                    else if (kw.includes(lowerKeyword)) matchScore += 5;
                }
                if (matchScore > 0) {
                    matches.push({ item, score: matchScore });
                }
            }
            // 按分数排序
            matches.sort((a, b) => b.score - a.score);
            // 提取匹配的ID
            const matchedIds = matches.map(m => m.item.id);
            if (matchedIds.length === 0) {
                return []; // 没有匹配项
            }
            // 过滤掉已显示的ID
            let availableIds = matchedIds.filter(id => !displayedImageIds.has(id));
            if (availableIds.length === 0) {
                // 重置该类别相关的已显示记录
                matchedIds.forEach(id => displayedImageIds.delete(id));
                // 重新过滤
                const refreshedIds = matchedIds.filter(id => !displayedImageIds.has(id));
                if (refreshedIds.length === 0) {
                    // 如果仍然为空，返回第一个匹配项
                    return [matchedIds[0]];
                }
                availableIds = refreshedIds;
            }
            // 随机选择
            const selectedIds = [];
            let tempAvailable = [...availableIds];
            while (selectedIds.length < count && tempAvailable.length > 0) {
                const randomIndex = Math.floor(Math.random() * tempAvailable.length);
                selectedIds.push(tempAvailable[randomIndex]);
                tempAvailable.splice(randomIndex, 1);
            }
            // 添加到已显示集合
            selectedIds.forEach(id => displayedImageIds.add(id));
            return selectedIds;
        }

        // 检查语音识别支持
        function checkVoiceRecognitionSupport() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                console.log('浏览器不支持语音识别');
                return false;
            }
            return true;
        }

        // 初始化语音识别（问一问页面）
        function initVoiceRecognition() {
            if (!checkVoiceRecognitionSupport()) return false;
            
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                recognitionStarting = false;
                document.getElementById('bigVoiceText').textContent = '正在听你说... 🎤';
                document.getElementById('bigVoiceArea').classList.add('recording');
                console.log('语音识别已开始录音');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                console.log('识别到文字:', transcript);
                processUserMessage(transcript);
            };

            recognition.onerror = function(event) {
                console.error('语音识别错误:', event.error);
                isRecording = false;
                recognitionStarting = false;
                document.getElementById('bigVoiceText').textContent = '点击这里和哒哒说话 🎤';
                document.getElementById('bigVoiceArea').classList.remove('recording');
                
                if (event.error === 'no-speech') {
                    // 没有检测到语音，显示文本输入（不再显示错误提示）
                    toggleTextInput();
                } else if (event.error === 'not-allowed') {
                    alert('请允许使用麦克风以使用语音功能');
                } else if (event.error !== 'aborted') {
                    // 其他错误（除了用户主动停止）才提示
                    toggleTextInput();
                }
            };

            recognition.onend = function() {
                isRecording = false;
                recognitionStarting = false;
                document.getElementById('bigVoiceText').textContent = '点击这里和哒哒说话 🎤';
                document.getElementById('bigVoiceArea').classList.remove('recording');
                console.log('语音识别已结束');
            };

            return true;
        }

        // 开始语音识别
        function startVoiceRecognition() {
            console.log('开始语音识别，当前状态:', {isRecording, recognitionStarting});
            
            // 如果已经在录音，停止录音
            if (isRecording) {
                console.log('正在录音中，停止录音');
                recognition.stop();
                return;
            }
            
            // 如果识别器正在启动中，忽略重复点击
            if (recognitionStarting) {
                console.log('语音识别正在启动中，忽略重复点击');
                return;
            }
            
            if (!recognition) {
                if (!initVoiceRecognition()) {
                    alert('你的浏览器不支持语音识别哦😟，请使用Chrome/Edge浏览器！');
                    toggleTextInput();
                    return;
                }
            }
            
            try {
                recognitionStarting = true;
                recognition.start();
                console.log('语音识别已启动');
            } catch(e) {
                console.error('启动语音识别失败:', e);
                recognitionStarting = false;
                // 如果启动失败，显示文本输入作为备选
                toggleTextInput();
            }
        }

        // 调用聊天 API (视觉模型格式)
        async function callChatAPI(userMessage, context = null) {
            // 构建对话历史消息
            const messages = [];
            
            // 首先添加系统提示
            messages.push({
                role: 'system',
                content: CHAT_SYSTEM_PROMPT
            });
            
            // 如果有上下文，添加上下文信息
            if (context && context.lastImageRequest && context.lastImageRequest.trim() !== '') {
                messages.push({
                    role: 'system',
                    content: `上下文信息：用户之前提到过 "${context.lastImageRequest}"，如果用户说"生成一个"或类似的话，请继续处理这个主题。`
                });
            }
            
            // 如果有对话历史，添加历史记录（最近3条）
            if (context && context.conversationHistory && context.conversationHistory.length > 0) {
                const recentHistory = context.conversationHistory.slice(-3);
                for (const item of recentHistory) {
                    messages.push({
                        role: item.role === 'user' ? 'user' : 'assistant',
                        content: item.content
                    });
                }
            }
            
            // 添加当前用户消息
            messages.push({
                role: 'user',
                content: userMessage
            });
            
            // 使用视觉模型格式（支持图片）
            const requestBody = {
                model: CHAT_CONFIG.model,
                messages: messages
            };
            
            console.log('发送请求:', JSON.stringify(requestBody));
            
            const response = await fetch(CHAT_CONFIG.endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + CHAT_CONFIG.apiKey
                },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error('API 调用失败: ' + response.status + ' - ' + errorText);
            }
            
            const result = await response.json();
            console.log('大模型返回:', result);
            
            // 提取回复内容
            let responseText = '';
            if (result.choices && result.choices.length > 0) {
                // 处理 content 可能是字符串或数组
                const content = result.choices[0].message.content;
                if (typeof content === 'string') {
                    responseText = content;
                } else if (Array.isArray(content)) {
                    // 查找 text 类型的消息
                    for (const item of content) {
                        if (item.type === 'text') {
                            responseText = item.text;
                            break;
                        }
                    }
                }
            }
            
            console.log('提取的回复:', responseText);
            return responseText || '';
            
            throw new Error('未获取到有效回复');
        }

        // 尝试依次加载图片路径
        function tryImageSequence(imgId, paths, index) {
            if (index >= paths.length) {
                console.log('所有图片路径都加载失败');
                const img = document.getElementById(imgId);
                if (img) {
                    // 显示错误消息
                    img.style.display = 'none';
                    const errorMsg = document.createElement('div');
                    errorMsg.style.color = '#ff6b6b';
                    errorMsg.style.marginTop = '10px';
                    errorMsg.textContent = '图片加载失败，请稍后再试';
                    img.parentNode.appendChild(errorMsg);
                }
                return;
            }
            
            const img = document.getElementById(imgId);
            if (!img) return;
            
            const path = paths[index];
            console.log('尝试加载图片路径', index, ':', path);
            
            img.onload = function() {
                console.log('图片加载成功:', path);
            };
            
            img.onerror = function() {
                console.log('图片加载失败，尝试下一个路径:', path);
                // 尝试下一个路径
                setTimeout(() => tryImageSequence(imgId, paths, index + 1), 100);
            };
            
            img.src = path;
        }

                    const answers = localAnswers[key];
                    return answers[Math.floor(Math.random() * answers.length)];
                }
            }
            
            const defaultAnswers = localAnswers['default'];
            return defaultAnswers[Math.floor(Math.random() * defaultAnswers.length)];
        }

        // 删除当前预览的图片
        function deleteCurrentImage() {
            if (!currentPreviewElement) {
                alert('没有选中的图片');
                return;
            }
            
            var img = currentPreviewElement.querySelector('img');
            var imgName = img ? img.alt : '';
            var imgSrc = img ? img.src : '';
            
            if (!confirm('确定要删除这张图片吗？\n' + imgName)) {
                return;
            }
            
            // 从 localStorage 中删除
            try {
                var stored = JSON.parse(localStorage.getItem('dada_images') || '{}');
                
                // 查找图片所在的分类
                var grids = ['realGrid', 'playGrid', 'workGrid'];
                var category = null;
                
                for (var i = 0; i < grids.length; i++) {
                    var grid = document.getElementById(grids[i]);
                    if (grid && grid.contains(currentPreviewElement)) {
                        category = grids[i].replace('Grid', '');
                        break;
                    }
                }
                
                if (category && stored[category]) {
                    // 找到并删除对应的图片数据
                    for (var j = 0; j < stored[category].length; j++) {
                        if (stored[category][j].name === imgName || stored[category][j].dataUrl === imgSrc) {
                            stored[category].splice(j, 1);
                            break;
                        }
                    }
                    
                    localStorage.setItem('dada_images', JSON.stringify(stored));
                }
                
                // 从页面上移除图片元素
                currentPreviewElement.remove();
                
                alert('图片已删除！');
                closePreview();
                
            } catch (e) {
                console.error('删除图片失败:', e);
                alert('删除失败，请重试');
            }
        }

        // ---------------- 照片上传功能 ----------------
        function uploadPhotos(event) {
            var files = event.target.files;
            if (!files || files.length === 0) {
                alert('请选择要上传的图片');
                return;
            }

            var activeGrid = document.getElementById(currentViewTab + 'Grid');
            var categoryName = getCategoryName(currentViewTab);
            var uploadCount = 0;
            
            for (var i = 0; i < files.length; i++) {
                var file = files[i];
                if (!file.type.startsWith('image/')) continue;

                uploadCount++;
                
                // 读取文件为 dataURL（用于保存和显示）
                var reader = new FileReader();
                reader.onload = (function(f, idx) {
                    return function(e) {
                        var imgUrl = e.target.result;
                        
                        // 创建图片项
                        var photoItem = document.createElement('div');
                        photoItem.className = 'photo-item';
                        photoItem.onclick = function() { previewImage(this); };
                        
                        var img = document.createElement('img');
                        img.src = imgUrl;
                        img.alt = f.name || ('上传的照片' + (idx + 1));
                        
                        photoItem.appendChild(img);
                        activeGrid.appendChild(photoItem);
                        
                        // 保存到localStorage
                        saveImageMetadata(f, currentViewTab, imgUrl);
                        
                        // 自动触发下载，让用户保存到数据库文件夹
                        setTimeout(function() {
                            var link = document.createElement('a');
                            link.download = '[' + categoryName + ']' + (f.name || ('IMG_' + Date.now() + '.jpg'));
                            link.href = imgUrl;
                            link.click();
                        }, idx * 500);
                    };
                })(file, i);
                reader.readAsDataURL(file);
            }

            document.getElementById('fileInput').value = '';
            alert('成功上传 ' + uploadCount + ' 张照片！\n图片将自动下载，请保存到：\n' + categoryName + ' 文件夹');
        }

        // 压缩图片以适应 localStorage
        function compressImage(file, maxWidth, quality, callback) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var width = img.width;
                    var height = img.height;
                    
                    if (width > maxWidth) {
                        height = Math.round(height * (maxWidth / width));
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    var dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ---------------- 画板核心功能 ----------------
        // 初始化画板
        function initCanvas() {
            canvas = document.getElementById('drawCanvas');
            ctx = canvas.getContext('2d');
            
            // 设置canvas尺寸（适配容器）
            resizeCanvas();
            
            // 只在首次初始化时绑定事件和监听器
            if (!canvasInitialized) {
                window.addEventListener('resize', resizeCanvas);
                
                // 绑定绘画事件（支持鼠标和触摸）
                // 鼠标事件
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);
                
                // 触摸事件（移动端）
                canvas.addEventListener('touchstart', handleTouchStart);
                canvas.addEventListener('touchmove', handleTouchMove);
                canvas.addEventListener('touchend', handleTouchEnd);
                
                canvasInitialized = true;
            }
            
            // 初始化画笔样式
            ctx.lineCap = 'round'; // 圆形笔触（苹果画板风格）
            ctx.lineJoin = 'round';
            ctx.strokeStyle = brushColor;
            ctx.lineWidth = brushSize;
            
            // 清空历史记录（重新进入画板时）
            strokeHistory = [];
            currentStroke = [];
        }

        // 调整Canvas尺寸
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            // 重新绘制历史记录
            redrawCanvas();
        }

        // 开始绘画
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
            currentStroke = [{ x: lastX, y: lastY, color: brushColor, size: brushSize }];
        }

        // 绘制中
        function draw(e) {
            if (!isDrawing) return;
            
            // 绘制线条
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            
            // 更新坐标
            [lastX, lastY] = [e.offsetX, e.offsetY];
            
            // 记录当前笔画
            currentStroke.push({ x: lastX, y: lastY, color: brushColor, size: brushSize });
        }

        // 停止绘画
        function stopDrawing() {
            if (isDrawing && currentStroke.length > 1) {
                strokeHistory.push([...currentStroke]); // 保存完整笔画到历史记录
            }
            isDrawing = false;
            currentStroke = [];
        }

        // 处理触摸开始
        function handleTouchStart(e) {
            e.preventDefault(); // 阻止默认滚动行为
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            isDrawing = true;
            [lastX, lastY] = [x, y];
            currentStroke = [{ x: lastX, y: lastY, color: brushColor, size: brushSize }];
        }

        // 处理触摸移动
        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            // 绘制线条
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            // 更新坐标
            [lastX, lastY] = [x, y];
            
            // 记录当前笔画
            currentStroke.push({ x: lastX, y: lastY, color: brushColor, size: brushSize });
        }

        // 处理触摸结束
        function handleTouchEnd(e) {
            e.preventDefault();
            if (isDrawing && currentStroke.length > 1) {
                strokeHistory.push([...currentStroke]);
            }
            isDrawing = false;
            currentStroke = [];
        }

        // 设置画笔颜色
        function setBrushColor(color, element) {
            brushColor = color;
            ctx.strokeStyle = color;
            
            // 更新选中状态
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
        }

        // 设置画笔粗细
        function setBrushSize(size) {
            brushSize = size;
            ctx.lineWidth = size;
        }

        // 撤销上一步
        function undoLastStroke() {
            if (strokeHistory.length === 0) {
                alert("已经没有可以撤销的笔画啦😜");
                return;
            }
            strokeHistory.pop();
            redrawCanvas();
        }

        // 清空画布
        function clearCanvas() {
            if (confirm("确定要清空画板吗？😯")) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                strokeHistory = [];
                currentStroke = [];
            }
        }

        // 重新绘制画布（用于撤销和resize）
        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 重新绘制所有历史笔画
            strokeHistory.forEach(stroke => {
                if (stroke.length < 2) return;
                
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                
                ctx.strokeStyle = stroke[0].color;
                ctx.lineWidth = stroke[0].size;
                ctx.stroke();
            });
            
            // 恢复当前画笔样式
            ctx.strokeStyle = brushColor;
            ctx.lineWidth = brushSize;
        }

        // 保存绘画作品
        function saveDrawing() {
            if (strokeHistory.length === 0) {
                alert("先画点什么再保存吧🎨！");
                return;
            }
            
            // 获取画布图片数据

        // 初始化拍一拍页面的语音识别
        function initPhotoVoiceRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!window.SpeechRecognition) {
                alert("你的浏览器不支持语音识别哦😟，请使用Chrome/Edge浏览器！");
                return false;
            }

            photoRecognition = new SpeechRecognition();
            photoRecognition.lang = 'zh-CN'; // 中文识别
            photoRecognition.interimResults = false; // 只返回最终结果
            photoRecognition.maxAlternatives = 1;

            // 识别开始
            photoRecognition.onstart = function() {
                isPhotoRecording = true;
                document.getElementById('photoVoiceBtn').classList.add('recording');
            };

            // 识别结果
            photoRecognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('voiceInputText').value = transcript;
                
                // 检查是否可以启用生成按钮
                checkGenerateButtonStatus();
            };

            // 识别结束
            photoRecognition.onend = function() {
                if (isPhotoRecording) {
                    photoRecognition.start(); // 持续监听
                } else {
                    document.getElementById('photoVoiceBtn').classList.remove('recording');
                }
            };

            // 识别错误
            photoRecognition.onerror = function(event) {
                console.error('语音识别错误:', event.error);
                isPhotoRecording = false;
                document.getElementById('photoVoiceBtn').classList.remove('recording');
            };

            return true;
        }

            if (!photoRecognition && !initPhotoVoiceRecognition()) return;

                photoRecognition.stop();

            } else {

            }
        }

        // 调用图生视频 API
        async function callVideoGenerationAPI(imageUrl, prompt) {
            // 构建请求体
            const requestBody = {
                model: AI_CONFIG.model,
                content: [
                    {
                        "type": "text",
                        "text": prompt + " --duration 5 --camerafixed false --watermark true"
                    },
                    {
                        "type": "image_url",
                        "image_url": {
                            "url": imageUrl
                        }
                    }
                ]
            };
            
            console.log('API 请求:', JSON.stringify(requestBody, null, 2));
            
            const response = await fetch(AI_CONFIG.endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + AI_CONFIG.apiKey
                },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error('API 调用失败: ' + response.status + ' - ' + errorText);
            }
            
            return await response.json();
        }

        // 轮询任务状态
        async function pollTaskStatus(taskId, maxAttempts = 60) {
            const statusEndpoint = AI_CONFIG.endpoint.replace('/tasks', '/tasks/' + taskId);
            
            console.log('开始轮询任务:', taskId);
            
            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const response = await fetch(statusEndpoint, {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer ' + AI_CONFIG.apiKey
                        }
                    });
                    
                    const result = await response.json();
                    console.log('任务状态:', result.status, '尝试次数:', i + 1);
                    
                    if (result.status === 'SUCCEEDED') {
                        // 任务完成，返回视频URL
                        return result.output?.video_url;
                    } else if (result.status === 'FAILED') {
                        console.error('任务失败:', result);
                        return null;
                    }
                    
                    // 等待 2 秒后再次查询
                    await new Promise(resolve => setTimeout(resolve, 2000));
                } catch (error) {
                    console.error('查询任务状态失败:', error);
                    return null;
                }
            }
            
            return null;
        }
